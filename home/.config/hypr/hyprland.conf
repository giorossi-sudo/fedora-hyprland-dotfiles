########################################################################################
# Hyprland Config - Fedora GNOME Adapted
# Basato sui dotfiles di Riccardo Palombo (ThinkPad X1 OLED)
# Adattato per Fedora 40/41/42+ con GNOME (Hyprland 0.56+)
########################################################################################

#
# VARIABILI D'AMBIENTE (Cruciali per non rompere la sessione GNOME su Fedora)
#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = BROWSER,firefox
env = EDITOR,micro
env = SWAYSOCK,$XDG_RUNTIME_DIR

#
# MONITOR (Ottimizzato per ASUS Zenbook 14 OLED 2.8K 2880x1800)
#
monitor=eDP-1,2880x1800@90,auto,1.6
monitor=,addreserved,-15,-15,0,0

# Autostart
exec-once=$HOME/.config/hypr/autostart

input {
    kb_layout=it
    follow_mouse=1

    touchpad {
        natural_scroll=yes
        tap-to-click=yes
    }
    sensitivity=0
}

general {
    gaps_in=10
    gaps_out=20
    border_size=2
    col.inactive_border=0xFF181818
    col.active_border=0x77e60012 0x11181818 0x77E60012 30deg
    resize_on_border=1
}

decoration {
    rounding=0
    dim_inactive=0
    dim_strength=0.5

    shadow {
        enabled=false
        range=20
        offset=5 5
        render_power=3
        color=0x33000000
    }

    blur {
        enabled=false
    }
}

animations {
    enabled=1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,slide
    animation=border,1,8,default
    animation=fade,1,3,default
    animation=workspaces,1,5,overshot,slide
}

dwindle {
    split_width_multiplier=1.5
}

gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo=yes
}

# Window Rules
windowrule=float 1,match:title ^(fly-foot-write)$
windowrule=float 1,match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule=float 1,match:class ^(polkit-gnome-authentication-agent-1)$

windowrule=border_color rgb(666666) rgb(000000),match:class ^(code-oss)$
windowrule=border_color rgb(FFFFFF) rgb(000000),match:title ^(fly-foot-write)$

# Mouse binds
bindm=SUPERSHIFT,mouse:272,movewindow
bindm=SUPER,mouse:272,resizewindow

# App & system binds
bind=SUPER,RETURN,exec,footclient
bind=SUPERSHIFT,RETURN,exec,footclient --override=colors.background=6E1200 --title=fly-foot-tiled
bind=SUPERSHIFT,Q,killactive,
bind=SUPERSHIFT,E,exec,$HOME/scripts/tofi-power.sh
bind=SUPER,T,exec,nemo
bind=SUPER,V,togglefloating, 
bind=SUPER,SPACE,exec,tofi-drun

bind=SUPER,B,exec,killall -SIGUSR1 waybar

bind=SUPER,F,fullscreen
bind=SUPERSHIFT,F,fullscreen,1

# Screenshot
bind=,Print,exec,grim -l 1 $HOME/Pictures/$(date +'%s_grim.png') && notify-send "Screenshot salvato!"

# Navigazione finestre
bind=SUPER,left,movefocus,l
bind=SUPER,right,movefocus,r
bind=SUPER,up,movefocus,u
bind=SUPER,down,movefocus,d
 
bind=SUPERSHIFT,left,movewindow,l
bind=SUPERSHIFT,right,movewindow,r
bind=SUPERSHIFT,up,movewindow,u
bind=SUPERSHIFT,down,movewindow,d

binde=SUPERCTRL,left,resizeactive,-60 0
binde=SUPERCTRL,right,resizeactive,60 0
binde=SUPERCTRL,up,resizeactive,0 -60
binde=SUPERCTRL,down,resizeactive,0 60

# Workspaces
bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

bind=SUPERSHIFT,1,movetoworkspacesilent,1
bind=SUPERSHIFT,2,movetoworkspacesilent,2
bind=SUPERSHIFT,3,movetoworkspacesilent,3
bind=SUPERSHIFT,4,movetoworkspacesilent,4
bind=SUPERSHIFT,5,movetoworkspacesilent,5
bind=SUPERSHIFT,6,movetoworkspacesilent,6
bind=SUPERSHIFT,7,movetoworkspacesilent,7
bind=SUPERSHIFT,8,movetoworkspacesilent,8
bind=SUPERSHIFT,9,movetoworkspacesilent,9
bind=SUPERSHIFT,0,movetoworkspacesilent,10

bind=SUPER,mouse_down,workspace,e+1
bind=SUPER,mouse_up,workspace,e-1

# Controllo Volume & Luminosità con OSD Wob
bind=,XF86AudioRaiseVolume,exec,pamixer -ui 5 && pamixer --get-volume > $SWAYSOCK.wob 
bind=,XF86AudioLowerVolume,exec,pamixer -ud 5 && pamixer --get-volume > $SWAYSOCK.wob
bind=,XF86AudioMute,exec,pamixer --toggle-mute && ( pamixer --get-mute && echo 0 > $SWAYSOCK.wob )
bind=,XF86AudioMicMute,exec,pactl set-source-mute @DEFAULT_SOURCE@ toggle 
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%- | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $SWAYSOCK.wob
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5% | sed -En 's/.*\(([0-9]+)%\).*/\1/p' > $SWAYSOCK.wob
